<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16202B">
<title>Phase 1 Training Split</title>

<style>
  :root {
    --bg: #16202B;
    --surface: #1E2B38;
    --surface-hi: #27384A;
    --line: #33485C;
    --text: #E9EFF4;
    --muted: #90A5B8;
    --hot: #FF5F3D;
    --warm: #E8A33D;
    --body-fill: #33475A;
    --body-stroke: #46617A;
    --ok: #4FBF8B;
    --radius: 12px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    padding-bottom: 88px;
  }

  /* ---------- top bar ---------- */

  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(22, 32, 43, 0.94);
    backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px 0 0;
  }

  .bar h1 {
    margin: 0 16px 2px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  .bar .meta {
    margin: 0 16px 10px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .days {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px 12px;
    scrollbar-width: none;
  }
  .days::-webkit-scrollbar { display: none; }

  .day-btn {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 550;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, color .15s, border-color .15s;
  }
  .day-btn[aria-selected="true"] {
    background: var(--hot);
    border-color: var(--hot);
    color: #16202B;
  }
  .day-btn:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  /* ---------- day header ---------- */

  .day-head { padding: 18px 16px 4px; }
  .day-head h2 {
    margin: 0;
    font-size: 24px;
    font-weight: 680;
    letter-spacing: -0.02em;
  }
  .day-head p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  .progress-wrap { padding: 12px 16px 0; }
  .progress {
    height: 3px;
    background: var(--surface-hi);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: var(--ok);
    transition: width .25s ease;
  }
  .progress-label {
    margin-top: 6px;
    font-size: 12px;
    color: var(--muted);
  }

  /* ---------- exercise list ---------- */

  .list { padding: 14px 12px 0; display: flex; flex-direction: column; gap: 8px; }

  .ex {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .ex.done { border-color: rgba(79,191,139,.45); }
  .ex.cardio { background: transparent; border-style: dashed; }

  .ex-head {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 13px 13px;
    cursor: pointer;
  }

  .idx {
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
    text-align: center;
  }
  .ex.done .idx { color: var(--ok); }

  .ex-name {
    font-size: 15px;
    font-weight: 560;
    letter-spacing: -0.005em;
    line-height: 1.3;
  }
  .ex-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

  .load {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .load .sets { font-size: 17px; font-weight: 680; letter-spacing: -0.02em; }
  .load .reps { font-size: 12px; color: var(--muted); }

  /* ---------- expanded panel ---------- */

  .panel { display: none; border-top: 1px solid var(--line); padding: 14px 13px 15px; }
  .ex.open .panel { display: block; }

  .cue {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
  }

  .figure { display: flex; justify-content: center; margin-bottom: 10px; }
  .figure svg { width: 100%; max-width: 300px; height: auto; }

  .m-body { fill: #2B3B4A; stroke: #3E5468; stroke-width: .7; stroke-linejoin: round; }
  .m-base { fill: var(--body-fill); stroke: var(--body-stroke); stroke-width: .6; }
  .m-primary { fill: var(--hot); stroke: #FF8A6E; stroke-width: .6; }
  .m-secondary { fill: var(--warm); stroke: #F2BE6E; stroke-width: .6; }
  .view-label { fill: var(--muted); font-size: 8px; font-family: inherit; }

  .legend { display: flex; gap: 16px; justify-content: center; font-size: 11.5px; color: var(--muted); margin-bottom: 12px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .legend .p i { background: var(--hot); }
  .legend .s i { background: var(--warm); }

  .muscles { font-size: 13px; line-height: 1.6; }
  .muscles div { color: var(--muted); }
  .muscles b { color: var(--text); font-weight: 560; }

  .pips { display: flex; gap: 7px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .pip {
    width: 38px; height: 38px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface-hi);
    color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .pip[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #10261C; }
  .pip:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
  .pips .pip-label { font-size: 12px; color: var(--muted); margin-left: 2px; }

  /* ---------- rest timer ---------- */

  .timer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: rgba(22,32,43,.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: 22px;
    font-weight: 680;
    letter-spacing: -0.02em;
    min-width: 66px;
  }
  .clock.ringing { color: var(--hot); }
  .tbtn {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font: inherit; font-size: 13.5px; font-weight: 560;
    padding: 10px 6px;
    border-radius: 10px;
    cursor: pointer;
  }
  .tbtn.go { background: var(--hot); border-color: var(--hot); color: #16202B; }
  .tbtn:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }

  /* ---------- notes ---------- */

  .notes { padding: 26px 16px 10px; }
  .notes h3 { margin: 0 0 10px; font-size: 15px; font-weight: 640; }
  .notes details {
    border-top: 1px solid var(--line);
    padding: 11px 0;
  }
  .notes summary {
    cursor: pointer;
    font-size: 14px;
    font-weight: 540;
    list-style: none;
  }
  .notes summary::-webkit-details-marker { display: none; }
  .notes summary::after { content: "+"; float: right; color: var(--muted); }
  .notes details[open] summary::after { content: "\2013"; }
  .notes p { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); line-height: 1.55; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="bar">
  <h1>Phase 1 Training Split</h1>
  <div class="meta">6 days &middot; roughly 140 sets a week &middot; deload at week 5</div>
  <div class="days" role="tablist" id="days"></div>
</div>

<div class="day-head">
  <h2 id="dayTitle"></h2>
  <p id="dayFocus"></p>
</div>

<div class="progress-wrap">
  <div class="progress"><span id="bar"></span></div>
  <div class="progress-label" id="barLabel"></div>
</div>

<div class="list" id="list"></div>

<div class="notes">
  <h3>Things to keep in mind</h3>
  <div id="notes"></div>
</div>

<div class="timer">
  <div class="clock" id="clock">2:00</div>
  <button class="tbtn go" id="startBtn">Start rest</button>
  <button class="tbtn" id="lessBtn">&minus;30s</button>
  <button class="tbtn" id="moreBtn">+30s</button>
</div>

/* ---------------------------------------------------------------
   Rendering
--------------------------------------------------------------- */

const state = { day: 0, done: {} };

function figureFor(primary, secondary) {
  const wrap = document.createElement("div");
  wrap.className = "figure";
  wrap.innerHTML = FIGURE;
  wrap.querySelectorAll("[data-m]").forEach(el => {
    const m = el.getAttribute("data-m");
    if (primary.includes(m)) el.setAttribute("class", "m-primary");
    else if (secondary.includes(m)) el.setAttribute("class", "m-secondary");
  });
  return wrap;
}

function key(d, i, s) { return d + ":" + i + ":" + s; }

function setCount(ex) { return typeof ex.sets === "number" ? ex.sets : 0; }

function updateProgress() {
  const day = DAYS[state.day];
  let total = 0, done = 0;
  day.ex.forEach((ex, i) => {
    const n = setCount(ex);
    total += n;
    for (let s = 0; s < n; s++) if (state.done[key(state.day, i, s)]) done++;
  });
  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("barLabel").textContent =
    done === 0 ? "Tap the numbered squares to log each set."
               : done + " of " + total + " sets logged";
}

function renderDay() {
  const day = DAYS[state.day];
  document.getElementById("dayTitle").textContent = day.title;
  document.getElementById("dayFocus").textContent = day.focus;

  document.querySelectorAll(".day-btn").forEach((b, i) =>
    b.setAttribute("aria-selected", i === state.day));

  const list = document.getElementById("list");
  list.innerHTML = "";

  day.ex.forEach((ex, i) => {
    const card = document.createElement("div");
    card.className = "ex" + (ex.cardio ? " cardio" : "");

    const head = document.createElement("div");
    head.className = "ex-head";
    head.setAttribute("role", "button");
    head.setAttribute("tabindex", "0");
    head.innerHTML =
      '<div class="idx">' + (ex.cardio ? "&bull;" : (i + 1)) + '</div>' +
      '<div><div class="ex-name"></div>' +
      (ex.tag ? '<div class="ex-sub"></div>' : '') + '</div>' +
      '<div class="load"><div class="sets"></div><div class="reps"></div></div>';
    head.querySelector(".ex-name").textContent = ex.n;
    if (ex.tag) head.querySelector(".ex-sub").textContent = ex.tag;
    head.querySelector(".sets").textContent = ex.sets === "-" ? "" : ex.sets + "\u00D7";
    head.querySelector(".reps").textContent = ex.reps;

    const panel = document.createElement("div");
    panel.className = "panel";

    const cue = document.createElement("p");
    cue.className = "cue";
    cue.textContent = ex.cue;
    panel.appendChild(cue);

    if (ex.p.length || ex.s.length) {
      panel.appendChild(figureFor(ex.p, ex.s));

      const legend = document.createElement("div");
      legend.className = "legend";
      legend.innerHTML = '<span class="p"><i></i>Primary</span><span class="s"><i></i>Assisting</span>';
      panel.appendChild(legend);

      const mus = document.createElement("div");
      mus.className = "muscles";
      if (ex.p.length) {
        const d = document.createElement("div");
        d.innerHTML = "<b>Primary:</b> " + ex.p.map(m => NAMES[m]).join(", ");
        mus.appendChild(d);
      }
      if (ex.s.length) {
        const d = document.createElement("div");
        d.innerHTML = "<b>Assisting:</b> " + ex.s.map(m => NAMES[m]).join(", ");
        mus.appendChild(d);
      }
      panel.appendChild(mus);
    }

    const n = setCount(ex);
    if (n) {
      const pips = document.createElement("div");
      pips.className = "pips";
      for (let s = 0; s < n; s++) {
        const b = document.createElement("button");
        b.className = "pip";
        b.type = "button";
        b.textContent = s + 1;
        b.setAttribute("aria-pressed", !!state.done[key(state.day, i, s)]);
        b.setAttribute("aria-label", "Set " + (s + 1) + " of " + ex.n);
        b.addEventListener("click", () => {
          const k = key(state.day, i, s);
          state.done[k] = !state.done[k];
          b.setAttribute("aria-pressed", !!state.done[k]);
          card.classList.toggle("done", allDone(i, n));
          updateProgress();
          if (state.done[k]) startTimer();
        });
        pips.appendChild(b);
      }
      const lbl = document.createElement("span");
      lbl.className = "pip-label";
      lbl.textContent = "logging a set starts the rest timer";
      pips.appendChild(lbl);
      panel.appendChild(pips);
    }

    head.addEventListener("click", () => card.classList.toggle("open"));
    head.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.classList.toggle("open"); }
    });

    if (allDone(i, n) && n) card.classList.add("done");

    card.appendChild(head);
    card.appendChild(panel);
    list.appendChild(card);
  });

  updateProgress();
  window.scrollTo({ top: 0, behavior: "auto" });
}

function allDone(i, n) {
  if (!n) return false;
  for (let s = 0; s < n; s++) if (!state.done[key(state.day, i, s)]) return false;
  return true;
}

/* ---------------------------------------------------------------
   Rest timer
--------------------------------------------------------------- */

let remaining = 120, target = 120, tick = null;

function paint() {
  const m = Math.floor(Math.abs(remaining) / 60);
  const s = Math.abs(remaining) % 60;
  const clock = document.getElementById("clock");
  clock.textContent = (remaining < 0 ? "+" : "") + m + ":" + String(s).padStart(2, "0");
  clock.classList.toggle("ringing", remaining <= 0);
}

function startTimer() {
  clearInterval(tick);
  remaining = target;
  paint();
  document.getElementById("startBtn").textContent = "Reset rest";
  tick = setInterval(() => {
    remaining--;
    paint();
    if (remaining === 0 && navigator.vibrate) navigator.vibrate([160, 90, 160]);
  }, 1000);
}

document.getElementById("startBtn").addEventListener("click", startTimer);
document.getElementById("lessBtn").addEventListener("click", () => {
  target = Math.max(30, target - 30); remaining = target; paint();
});
document.getElementById("moreBtn").addEventListener("click", () => {
  target = Math.min(600, target + 30); remaining = target; paint();
});

/* ---------------------------------------------------------------
   Boot
--------------------------------------------------------------- */

const tabs = document.getElementById("days");
DAYS.forEach((d, i) => {
  const b = document.createElement("button");
  b.className = "day-btn";
  b.type = "button";
  b.setAttribute("role", "tab");
  b.textContent = (i + 1) + "  " + d.tab;
  b.addEventListener("click", () => { state.day = i; renderDay(); });
  tabs.appendChild(b);
});

const notesWrap = document.getElementById("notes");
NOTES.forEach(([h, body]) => {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = h;
  const p = document.createElement("p");
  p.textContent = body;
  d.appendChild(s); d.appendChild(p);
  notesWrap.appendChild(d);
});

paint();
renderDay();
</script>
