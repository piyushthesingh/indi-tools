<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcf4e9">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Offline workout tracker: log sets, weights and reps, track PRs, edit your split.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Split">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<title>Training Split</title>
<script>
  /* apply a saved light/dark choice before first paint; "system" leaves it to the OS */
  try {
    var s = JSON.parse(localStorage.getItem("ts-v2") || "{}");
    var t = s && s.theme;
    if (s && s.v === 4 && (t === "dark" || t === "light")) document.documentElement.setAttribute("data-theme", t);
    else if (t === "dark" || localStorage.getItem("training-split-theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main class="app">
  <div id="viewToday" class="view"></div>
  <div id="viewHistory" class="view" hidden></div>
  <div id="viewProgress" class="view" hidden></div>
  <div id="viewYou" class="view" hidden></div>
</main>

<div class="rest-pill" id="restPill" hidden>
  <button class="rest-clock" id="restClockBtn" type="button" aria-label="Rest timer. Tap to pause or resume.">
    <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
      <circle class="ring-bg" cx="18" cy="18" r="15"/>
      <circle class="ring-fg" id="restRing" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="0" transform="rotate(-90 18 18)"/>
    </svg>
    <span class="rest-text"><small id="restLabel">REST</small><b class="num" id="restClock" role="timer">0:00</b></span>
  </button>
  <button class="rest-btn" id="restMinus" type="button" aria-label="15 seconds less">−15</button>
  <button class="rest-btn" id="restPlus" type="button" aria-label="15 seconds more">+15</button>
  <button class="rest-btn skip" id="restSkip" type="button">Skip</button>
</div>

<nav class="nav" aria-label="Main">
  <button class="nav-item" data-tab="today" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 7v10M17.5 7v10M3.5 10v4M20.5 10v4M6.5 12h11"/></svg>
    <span>Today</span>
    <i class="nav-dot" id="navTodayDot" hidden></i>
  </button>
  <button class="nav-item" data-tab="history" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
    <span>History</span>
  </button>
  <button class="nav-item" data-tab="progress" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 20h17M5.5 15.5l4.5-4.5 3.5 3L20 7"/></svg>
    <span>Progress</span>
  </button>
  <button class="nav-item" data-tab="you" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c1-4 3.8-6 7.5-6s6.5 2 7.5 6"/></svg>
    <span>You</span>
    <i class="nav-dot" id="navYouDot" hidden></i>
  </button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/catalog.js"></script>
<script src="js/images.js"></script>
<script src="js/templates.js"></script>
<script src="js/core.js"></script>
<script src="js/search.js"></script>
<script src="js/stats.js"></script>
<script src="js/sections.js"></script>
<script src="js/ui.js"></script>
<script src="js/timer.js"></script>
<script src="js/today.js"></script>
<script src="js/editor.js"></script>
<script src="js/history.js"></script>
<script src="js/progress.js"></script>
<script src="js/share.js"></script>
<script src="js/you.js"></script>
<script src="js/app.js"></script>
</body>
</html>
