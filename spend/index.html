<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spend · indi.tools</title>
  <meta name="description" content="A private, offline expense tracker that knows your credit card statement cycles. No login; your data stays on this phone.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0C1410">
  <meta name="color-scheme" content="dark light">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Spend">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- set the theme before first paint so there is no flash; dark is the default -->
  <script>(function(){try{if(localStorage.getItem('spend_theme')==='light'){document.documentElement.setAttribute('data-theme','light');document.querySelector('meta[name=theme-color]').content='#EEF3F0';document.querySelector('meta[name=apple-mobile-web-app-status-bar-style]').content='default'}}catch(e){}})();</script>

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app">
    <div class="boot" id="boot">Loading…</div>
  </div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="boot">Spend needs JavaScript to run.</p></noscript>
</body>
</html>
